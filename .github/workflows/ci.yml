name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build (0 warning exigé)
        run: dotnet build Crm.slnx -c Release
      - name: Tests
        run: dotnet test Crm.slnx -c Release --no-build --filter "Category!=Live"

  mutation:
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Stryker (seuil break 80)
        run: |
          dotnet tool install -g dotnet-stryker
          cd src/Crm.Core.Domain && dotnet stryker --break-at 80 || exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm test
